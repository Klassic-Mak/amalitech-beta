<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    <link rel="stylesheet" href="type.css" />
  </head>
  <body>
    <div class="container">
      <div class="left-panel">
        <h1>Welcome Back!</h1>
        <p>Enter your personal details to use all of site features</p>

        <button>Sign In</button>
      </div>

      <div class="right-panel">
        <h2>Create Account</h2>

        <div class="social-icons">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/archive/c/c1/20170301123009%21Google_%22G%22_logo.svg"
            alt=""
          />
          <img
            id="facebook-logo"
            class="facebook-logo"
            src="https://upload.wikimedia.org/wikipedia/commons/archive/b/b9/20231011122027%212023_Facebook_icon.svg"
            alt=""
          />
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg"
            alt="git-hib"
          />
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/8/81/LinkedIn_icon.svg"
            alt="linked-in"
          />
        </div>

        <p class="text">or use your email for registration</p>

        <form>
          <input type="text" placeholder="Name" />
          <input type="email" placeholder="Email" />
          <input type="password" placeholder="Password" />

          <button type="submit">Sign Up</button>
        </form>
      </div>
    </div>
  </body>
</html>
