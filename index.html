<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page | AmaliTech</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login">
      <h1>Hello Again!</h1>
      <p>Enter your credentials to login</p>

      <h3>Email</h3>
      <input type="email" name="email" placeholder="xxx@example.com" required />

      <h3>Password</h3>
      <input type="text" placeholder="xxxxxxx" class="input-box" required />
      <br />
      <button>Login</button>
    </div>
  </body>
</html>
